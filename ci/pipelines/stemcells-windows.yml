      AWS_ROLE_ARN: ((aws-stemcells_aws_access_key.role_arn))
      AWS_SECRET_KEY: ((aws-stemcells_aws_access_key.password))
  - in_parallel:
      fail_fast: true
      steps:
      - put: aws-untested
        params:
          file: bosh-windows-stemcell/light-bosh-stemcell-*-aws-xen-hvm-windows((BASE_OS_VERSION))-go_agent-((AWS_PACKER_REGION)).tgz
      - put: packer-output-ami
