# To configure this pipeline: pipelines/configure.sh windows-2019

anchors:
- &gcp_account_json ((cff-bosh-windows-stemcells_bosh-153_gcp_credentials_json))
- &bosh_windows_stemcell_builder_branch windows-2019
- &bosh_windows_stemcell_builder_semver_branch semver-2019
- &windows_stemcell_ci_image bosh/windows-stemcell-ci
- &windows_stemcell_ci_tag windows-2019
- &windows_os_version windows2019
- &windows_os_line "2019"
- &internal_worker_tag broadcom
- &worker_tag

groups:
- name: all
  jobs:
  - build-windows-stemcell-ci-image
  - clean-up-pre-release-blobstore
  - bump-deps
  - build
  - create-aws
  - test-aws
  - wuts-aws
  - create-aws-govcloud
  - test-aws-govcloud
  - wuts-aws-govcloud
  - create-azure
  - test-azure
  - wuts-azure
  - create-gcp
  - test-gcp
  - wuts-gcp
  - promote
  - promote-gcp
  - promote-aws
  - promote-azure
  - promote-stembuild
  - submit-azure-offer
  - publish-azure-offer
  - stembuild-windows
  - stembuild-linux
  - create-stembuild-linux-stemcell
  - test-stembuild-linux-stemcell
  - wuts-stembuild-linux-stemcell
  - create-stembuild-windows-stemcell
  - test-stembuild-windows-stemcell
  - wuts-stembuild-windows-stemcell
  - test-bosh-psmodules
  - test-stemcell-builder
  - github-release-stembuild
  - bump-minor
- name: aws
  jobs:
  - create-aws
  - test-aws
  - wuts-aws
- name: aws-govcloud
  jobs:
  - create-aws-govcloud
  - test-aws-govcloud
  - wuts-aws-govcloud
- name: azure
  jobs:
  - create-azure
  - test-azure
  - wuts-azure
- name: gcp
  jobs:
  - create-gcp
  - test-gcp
  - wuts-gcp
- name: vsphere
  jobs:
  - stembuild-windows
  - stembuild-linux
  - create-stembuild-linux-stemcell
  - test-stembuild-linux-stemcell
  - wuts-stembuild-linux-stemcell
  - create-stembuild-windows-stemcell
  - test-stembuild-windows-stemcell
  - wuts-stembuild-windows-stemcell
- name: promote
  jobs:
  - promote
  - promote-gcp
  - promote-aws
  - promote-azure
  - promote-stembuild
  - github-release-stembuild
  - submit-azure-offer
  - publish-azure-offer
  - bump-minor
- name: images
  jobs:
    - build-windows-stemcell-ci-image

resource_types:
- name: metalink-repository
  type: registry-image
  source:
    repository: dpb587/metalink-repository-resource
    username: ((docker.username))
    password: ((docker.password))
- name: file-url
  type: docker-image
  source:
    repository: pivotalservices/concourse-curl-resource
    tag: latest
    username: ((docker.username))
    password: ((docker.password))
- name: semver
  type: docker-image
  source:
    repository: concourse/semver-resource
    tag: "1.6"
    username: ((docker.username))
    password: ((docker.password))

resources:
# type: git
- name: stemcell-builder
  type: git
  tags: [*worker_tag]
  source:
    uri: https://github.com/cloudfoundry/bosh-windows-stemcell-builder.git
    branch: *bosh_windows_stemcell_builder_branch
    ignore_paths:
      - ci/
    username: bosh-admin-bot
    password: ((github_public_repo_token))
- name: bosh-windows-stemcell-builder-ci
  type: git
  tags: [*worker_tag]
  source:
    uri: https://github.com/cloudfoundry/bosh-windows-stemcell-builder.git
    branch: *bosh_windows_stemcell_builder_branch
    paths:
      - ci/
    username: bosh-admin-bot
    password: ((github_public_repo_token))
- name: bosh-windows-stemcell-builder-dockerfiles
  type: git
  tags: [*worker_tag]
  source:
    uri: https://github.com/cloudfoundry/bosh-windows-stemcell-builder.git
    branch: *bosh_windows_stemcell_builder_branch
    paths:
    - ci/azstemcell
    - ci/docker/Dockerfile
    username: bosh-admin-bot
    password: ((github_public_repo_token))
- name: golang-release
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-package-golang-release.git
    branch: main
- name: boshio
  type: git
  source:
    branch: main
    uri: https://github.com/cloudfoundry/bosh-io-stemcells-windows-index.git
    username: bosh-admin-bot
    password: ((github_public_repo_token))
- name: windows-utilities-release
  type: git
  source:
    uri: https://github.com/cloudfoundry/windows-utilities-release.git
- name: govmomi
  type: git
  source:
    uri: https://github.com/vmware/govmomi.git

# type: docker-image
- name: bosh-windows-stemcell-builder-ci-docker-image
  type: docker-image
  source:
    repository: *windows_stemcell_ci_image
    tag: *windows_stemcell_ci_tag
    username: ((docker.username))
    password: ((docker.password))

# type: registry-image
- name: bosh-windows-stemcell-builder-ci-image
  type: registry-image
  source:
    repository: *windows_stemcell_ci_image
    tag: *windows_stemcell_ci_tag
    username: ((docker.username))
    password: ((docker.password))
- name: ubuntu-image
  type: registry-image
  source:
    repository: ubuntu
    tag: latest
    username: ((docker.username))
    password: ((docker.password))
- name: golang-release-image
  type: registry-image
  source:
    repository: bosh/golang-release
    username: ((docker.username))
    password: ((docker.password))
- name: bosh-integration-registry-image
  type: registry-image
  source:
    repository: bosh/integration
    username: ((docker.username))
    password: ((docker.password))

# type: github-release
- name: openssh-release
  type: github-release
  source:
    owner: PowerShell
    repository: Win32-OpenSSH
    access_token: ((github_public_repo_token))
    tag_filter: v([^v].*)
- name: stemcell-builder-github-release
  type: github-release
  source:
    owner: cloudfoundry
    repository: bosh-windows-stemcell-builder
    access_token: ((github_public_repo_token))

- name: bosh-agent-release
  type: metalink-repository
  source:
    uri: git+https://github.com/cloudfoundry/bosh-agent-index.git//
    version: "~2"

- name: lgpo-binary
  type: file-url
  source:
    url: "https://download.microsoft.com/download/8/5/C/85C25433-A1B0-4FFA-9429-7E023E7DA8D8/LGPO.zip"
    filename: "LGPO.zip"

# type: semver
- name: aws-build-number
  type: semver
  tags: [*worker_tag]
  source:
